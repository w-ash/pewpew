<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>pewpew preview</title>
<style>
  html, body { margin: 0; height: 100%; background: #0b0b0e; color: #ddd;
               font: 13px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace; }
  body { display: flex; flex-direction: column; }
  #status { position: fixed; left: 0; right: 0; top: 0; padding: 6px 10px;
            background: #7f1d1d; color: #fff; display: none;
            white-space: pre; overflow-x: auto; z-index: 1; }
  /* The canvas takes whatever the footer leaves; resize() reads its client
     box, so no size is hard-coded here. */
  canvas { display: block; flex: 1 1 auto; width: 100%; min-height: 0; }
  /* Footer, in flow rather than fixed: the readout used to be pinned to the
     viewport bottom, where the lever row now is, and overprinted it. */
  #bar { flex: 0 0 auto; display: flex; align-items: center; gap: 1.4rem;
         padding: 0.7rem 1rem; border-top: 1px solid #23232b; }
  #meta { color: #666; white-space: nowrap; }
  #levers { flex: 1 1 auto; display: flex; flex-wrap: wrap;
            gap: 0.35rem 1.4rem; align-items: center; }
  .lever { display: flex; align-items: center; gap: 0.55rem; font-size: 0.85em; }
  .lever label { color: #888; }
  .lever label span { color: #555; }
  .lever output { color: #ddd; min-width: 5ch; text-align: right;
                  font-variant-numeric: tabular-nums; }
  .lever input[type="range"] {
    -webkit-appearance: none; appearance: none; width: 110px; height: 3px;
    background: #23232b; border-radius: 2px; cursor: pointer;
  }
  .lever input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none; width: 12px; height: 12px;
    border-radius: 50%; background: #ddd; border: none;
  }
  .lever input[type="range"]:active::-webkit-slider-thumb,
  .lever input[type="range"]:focus-visible::-webkit-slider-thumb { background: #d99a2b; }
  .lever input[type="range"]::-moz-range-thumb {
    width: 12px; height: 12px; border-radius: 50%; background: #ddd; border: none;
  }
  #reset { margin-left: auto; padding: 0.25rem 0.7rem; font: inherit;
           font-size: 0.85em; color: #888; background: none;
           border: 1px solid #23232b; border-radius: 3px; cursor: pointer; }
  #reset:hover { color: #ddd; }
</style>
</head>
<body>
<div id="status"></div>
<canvas id="c"></canvas>
<div id="bar">
  <div id="meta">connecting…</div>
  <div id="levers"></div>
</div>
<script>
"use strict";
// Colors arrive display-ready (gamma + quantize happen server-side, the
// Q-1 quantize-once point) — this page applies NO gamma of its own.
const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");
const statusEl = document.getElementById("status");
const metaEl = document.getElementById("meta");
const leversEl = document.getElementById("levers");

let layout = null;   // {px: Float32Array, py: Float32Array, n, radius}
let hello = null;
let last = null;     // latest frame bytes, redrawn on resize
let socket = null;
let engineError = null;     // the renderer's error, which outlives a refusal
let refusalTimer = null;
const levers = new Map();   // param name -> {input, out, spec, accepted}
const dragging = new Set(); // names whose slider is under the pointer

// The status bar carries two things: the renderer's error state, which
// persists until the engine clears it, and a refusal, which is transient.
// A refusal borrows the bar and hands it back rather than erasing an error
// that is still true.
function showStatus(refusal) {
  clearTimeout(refusalTimer);
  if (refusal) refusalTimer = setTimeout(showStatus, 4000);
  const text = refusal || engineError || "";
  statusEl.textContent = text;
  statusEl.style.display = text ? "block" : "none";
}

function clear() {
  ctx.fillStyle = "#0b0b0e";
  ctx.fillRect(0, 0, canvas.width, canvas.height);
}

function resize() {
  canvas.width = canvas.clientWidth * devicePixelRatio;
  canvas.height = canvas.clientHeight * devicePixelRatio;
  if (hello) layout = makeLayout(hello);
  if (last) draw(last); else clear();
}
addEventListener("resize", resize);

// 2D maps draw as-is (y=0 at the bottom); 3D maps draw their z-slices
// side by side, ascending z left to right — the same reading as the
// ANSI sink, so both previews agree on what "the cube" looks like.
function makeLayout(h) {
  const n = h.n, pos = h.positions;
  let sliceOf = new Int32Array(n), slices = 1;
  if (h.is3d) {
    const zs = [...new Set(pos.map(p => Math.round(p[2] * 100)))].sort((a, b) => a - b);
    slices = zs.length;
    const zi = new Map(zs.map((z, i) => [z, i]));
    for (let i = 0; i < n; i++) sliceOf[i] = zi.get(Math.round(pos[i][2] * 100));
  }
  const gutter = 0.15;                       // in slice widths
  const totalW = slices + gutter * (slices - 1);
  const pad = 30 * devicePixelRatio;
  const w = canvas.width - 2 * pad, hgt = canvas.height - 2 * pad;
  const px = new Float32Array(n), py = new Float32Array(n);

  // A degenerate y axis (a 1D strip) spans the full width, centered
  // vertically, with dot size from pixel spacing rather than cell area.
  const ys = pos.map(p => p[1]);
  if (!h.is3d && Math.max(...ys) - Math.min(...ys) < 1e-6) {
    for (let i = 0; i < n; i++) {
      px[i] = pad + pos[i][0] * w;
      py[i] = canvas.height / 2;
    }
    return { px, py, n, radius: Math.max(2, (w / n) * 0.6) };
  }

  const scale = Math.min(w / totalW, hgt);
  const x0 = (canvas.width - totalW * scale) / 2;
  const y0 = (canvas.height - scale) / 2;
  for (let i = 0; i < n; i++) {
    const off = sliceOf[i] * (1 + gutter);
    px[i] = x0 + (off + pos[i][0]) * scale;
    py[i] = y0 + (1 - pos[i][1]) * scale;     // y=0 at the bottom
  }
  // Dot size from typical spacing: assume roughly square slices.
  const perSlice = n / slices;
  const radius = Math.max(2, (scale / Math.max(4, Math.sqrt(perSlice))) * 0.42);
  return { px, py, n, radius };
}

// One slider per declared Param. The engine sends the range and the step,
// so a slider cannot reach a value the engine would refuse; `name` is the
// caption and `label` is the unit that annotates it.
function makeLevers(params) {
  levers.clear();
  dragging.clear();
  leversEl.replaceChildren();
  if (!params || !params.length) return;
  for (const p of params) {
    const el = document.createElement("span");
    el.className = "lever";
    el.innerHTML =
      `<label for="lv-${p.name}">${p.name}${p.label ? ` <span>${p.label}</span>` : ""}</label>` +
      `<input id="lv-${p.name}" type="range" min="${p.lo}" max="${p.hi}" step="${p.step}">` +
      `<output></output>`;
    const input = el.querySelector("input"), out = el.querySelector("output");
    const value = p.value ?? p.default;   // `declare` has no values
    const lever = { input, out, spec: p, accepted: value };
    levers.set(p.name, lever);
    show(lever, value);
    // Only sliders the user is actually holding are exempt from echoes;
    // everything else follows whichever tab moved last.
    input.addEventListener("pointerdown", () => dragging.add(p.name));
    for (const ev of ["pointerup", "pointercancel", "blur"])
      input.addEventListener(ev, () => dragging.delete(p.name));
    input.addEventListener("input", () => {
      out.textContent = (+input.value).toFixed(p.decimals);
      if (socket && socket.readyState === WebSocket.OPEN)
        socket.send(JSON.stringify({ type: "set", name: p.name, value: +input.value }));
    });
    leversEl.appendChild(el);
  }
  const reset = document.createElement("button");
  reset.id = "reset";
  reset.textContent = "reset";
  reset.addEventListener("click", () => {
    for (const [name, lv] of levers) {
      show(lv, lv.spec.default);
      if (socket && socket.readyState === WebSocket.OPEN)
        socket.send(JSON.stringify({ type: "set", name, value: lv.spec.default }));
    }
  });
  leversEl.appendChild(reset);
}

function show(lever, value) {
  lever.input.value = value;
  lever.out.textContent = (+value).toFixed(lever.spec.decimals);
}

function draw(bytes) {
  last = bytes;
  if (!layout) return;
  const t = new DataView(bytes.buffer, bytes.byteOffset, 8).getFloat32(0, true);
  const rgb = new Uint8Array(bytes.buffer, bytes.byteOffset + 8);
  clear();
  const r = layout.radius;
  ctx.shadowBlur = r * 2.2;                   // the glow, in display space
  for (let i = 0; i < layout.n; i++) {
    const c = `rgb(${rgb[3 * i]},${rgb[3 * i + 1]},${rgb[3 * i + 2]})`;
    ctx.fillStyle = c;
    ctx.shadowColor = c;
    ctx.beginPath();
    ctx.arc(layout.px[i], layout.py[i], r, 0, 2 * Math.PI);
    ctx.fill();
  }
  ctx.shadowBlur = 0;
  metaEl.textContent =
    `t=${t.toFixed(2)}s · ${layout.n}${hello.total > hello.n ? "/" + hello.total : ""} px`;
}

function connect() {
  const ws = new WebSocket(`ws://${location.host}/`);
  socket = ws;
  ws.binaryType = "arraybuffer";
  ws.onmessage = (ev) => {
    if (typeof ev.data === "string") {
      const msg = JSON.parse(ev.data);
      // A reconnect may bring a different map. `last` belongs to the old
      // one: redrawing it against the new layout reads past the buffer and
      // yields rgb(undefined,...), an invalid fillStyle that silently
      // leaves dots at their previous color.
      if (msg.type === "hello") { hello = msg; last = null; makeLevers(msg.params); resize(); }
      else if (msg.type === "status") { engineError = msg.error || null; showStatus(); }
      // A hot reload changed the knobs themselves; the `params` echo that
      // follows fills the rebuilt sliders in.
      else if (msg.type === "declare") makeLevers(msg.params);
      else if (msg.type === "params") {
        // What the engine actually holds. A slider under the pointer keeps
        // its position — yanking it mid-drag would fight the user — but its
        // accepted value still tracks, so a refusal snaps back correctly.
        for (const [name, value] of Object.entries(msg.values)) {
          const lever = levers.get(name);
          if (!lever) continue;
          lever.accepted = value;
          if (!dragging.has(name)) show(lever, value);
        }
      } else if (msg.type === "refused") {
        const lever = levers.get(msg.name);
        if (lever) show(lever, lever.accepted);   // back to what the engine holds
        showStatus(msg.reason);
      }
    } else {
      draw(new Uint8Array(ev.data));
    }
  };
  ws.onclose = () => {
    metaEl.textContent = "disconnected — retrying…";
    engineError = null;                      // the error died with its engine
    showStatus();
    setTimeout(connect, 1000);               // engine restarts are routine
  };
}
connect();
resize();
</script>
</body>
</html>
