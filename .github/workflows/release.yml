name: Release

on:
  push:
    tags: ["v*"]

# Least privilege: read by default; only the release job may write.
permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # The tagged commit is tested and its image built before anything is
  # published, so a public Release never points at code that cannot deploy.
  test:
    name: Test and build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0

      # --locked fails on a uv.lock that is stale for pyproject.toml.
      - name: Python tests
        run: |
          uv sync --locked --all-extras --all-groups
          uv run pytest

      # Reads the pnpm version from the root package.json's `packageManager` field.
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: package.json

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      # The browsers the unit tests run in, then the recipe a laptop runs:
      # tsc, the unit tests and both pages' builds.
      - name: Web checks, tests and builds
        run: |
          pnpm install --frozen-lockfile
          pnpm -C web exec playwright install --with-deps chromium webkit
          uv run just web

      - name: Docker build
        run: docker build .

  release:
    name: GitHub Release
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      TAG: ${{ github.ref_name }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check the version and extract release notes from CHANGELOG.md
        run: |
          VERSION="${TAG#v}"
          PROJECT=$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          if [ "$VERSION" != "$PROJECT" ]; then
            echo "::error::tag $TAG does not match pyproject.toml's version $PROJECT"
            exit 1
          fi
          awk -v ver="$VERSION" '
            /^## \[/ { if (found) exit; if (index($0, "[" ver "]")) { found = 1; next } }
            found { print }
          ' CHANGELOG.md > CHANGES.md
          if ! [ -s CHANGES.md ]; then
            echo "::error::CHANGELOG.md has no entry for $VERSION — add one before tagging"
            exit 1
          fi

      - name: Create GitHub Release
        run: gh release create "$TAG" --title "$TAG" --notes-file CHANGES.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy:
    name: Deploy to Fly.io
    runs-on: ubuntu-latest
    needs: release
    timeout-minutes: 20
    # Two tags pushed together deploy one after the other, never in a race.
    concurrency:
      group: fly-deploy
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # 1.6
        with:
          version: 0.4.114

      # --ha=false is load-bearing: Fly otherwise provisions a second machine
      # for high availability, which would split the in-memory render sessions
      # and rate limits. This app must stay at one machine.
      - run: flyctl deploy --remote-only --ha=false
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
