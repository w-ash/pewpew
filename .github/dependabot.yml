version: 2

updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    # Wait out a fresh release before adopting it.
    cooldown:
      default-days: 7
    groups:
      python-minor-patch:
        update-types: ["minor", "patch"]

  # Keeps the exact action tags in ci.yml current.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7

  # The pnpm workspace: the page's exact pins in web/package.json and the
  # studio's in studio-web/package.json, one lockfile. A web/ bump changes the
  # page's build hash, so its PR needs `just web` and the rebuilt page committed.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      frontend-minor-patch:
        update-types: ["minor", "patch"]
