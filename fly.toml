# fly.toml — pewpew studio, served at https://<app>.fly.dev. No custom domain;
# Fly's proxy terminates TLS and the app speaks plain HTTP.
#
# DATABASE_URL is a secret (`fly secrets set`). Without it the app uses SQLite
# in the container, which does not survive a redeploy.

# Fly app names are global, so `pewpew` is an example. If `fly apps create`
# reports it taken, pick another and change it here.
app = 'pewpew'

# Use the region nearest the database. Confirm against the Neon project's region
# before the first deploy.
primary_region = 'sjc'

# uvicorn shuts down gracefully on SIGINT (Fly's default) and SIGTERM alike;
# SIGTERM matches `docker stop`. 60s leaves headroom over uvicorn's own 30s
# drain bound (see the Dockerfile CMD).
kill_signal = 'SIGTERM'
kill_timeout = '60s'

[build]
  dockerfile = 'Dockerfile'

[http_service]
  internal_port = 8000
  force_https = true
  # Never 'stop'. One machine is a hard requirement, not a cost choice: render
  # sessions, admission limits and rate limits are held in memory by the app, so
  # a second machine would split them. Keep `fly scale count 1`.
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  # Well above the app's own cap of 20 sessions, so page loads, GLBs and new
  # sockets still reach the app when every session is open; the app refuses or
  # evicts sessions itself (src/pewpew/studio/limits.py).
  [http_service.concurrency]
    type = 'connections'
    hard_limit = 100
    soft_limit = 80

  # /health/live does not touch the database, so the probe never holds a
  # database compute out of autosuspend.
  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '60s'
    method = 'GET'
    path = '/health/live'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '1gb'
