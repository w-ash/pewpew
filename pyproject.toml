[project]
name = "pewpew"
version = "0.0.1"
description = "pewpew LED engine and its test harness — golden frames, fake clock, fleet-sim interfaces (ADR-017/018)"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "watchfiles>=1.0",
    "websockets>=17",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[dependency-groups]
bench = ["numba>=0.61"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pewpew", "src/harness"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
