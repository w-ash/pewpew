[project]
name = "pewpew-harness"
version = "0.0.1"
description = "pewpew test harness skeleton — golden frames, fake clock, fleet-sim interfaces (ADR-017/018)"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["harness"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
